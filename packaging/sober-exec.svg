<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1d26"/>
      <stop offset="1" stop-color="#0d0e14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c8df5"/>
      <stop offset="1" stop-color="#4b61d4"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="22" fill="none" stroke="#2a2c3a" stroke-width="2"/>
  <!-- chevron -->
  <path d="M 36 44 L 56 64 L 36 84" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- underscore -->
  <rect x="60" y="80" width="34" height="6" rx="3" fill="url(#accent)"/>
  <!-- accent dot -->
  <circle cx="98" cy="36" r="6" fill="#6c8df5"/>
</svg>
